name: Build

on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/Gamarr.sln -c Debug

      - name: Test
        run: |
          filter="Category!=IntegrationTest&Category!=AutomationTest&Category!=ManualTest&Category!=WINDOWS"
          for project in \
            src/NzbDrone.Common.Test/Gamarr.Common.Test.csproj \
            src/NzbDrone.Core.Test/Gamarr.Core.Test.csproj \
            src/NzbDrone.Api.Test/Gamarr.Api.Test.csproj \
            src/NzbDrone.Host.Test/Gamarr.Host.Test.csproj; do
            dotnet test "$project" -c Debug --no-build --filter "$filter"
          done

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The version the frontend lint and build are verified with (package.json has no engines field)
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile --network-timeout 120000

      - name: Lint
        run: |
          yarn lint
          yarn stylelint-linux

      - name: Build
        run: yarn build --env production
